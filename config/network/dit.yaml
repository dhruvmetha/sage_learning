# DiT (Diffusion Transformer) Network Configuration

_target_: src.model.dit.dit.DiT

# Image size (must match data)
img_size: ${image_size}

# Patch size for tokenization
patch: 4

# Input channels: 5 context (static, movable, target_object, robot_region, goal_sample_region) + 1 noisy target
in_ch: 6

# Output channels: target_goal only (goal-only prediction)
out_ch: 1

# Model dimension
dim: 256

# Number of transformer blocks
depth: 8

# Number of attention heads
heads: 8

# Geometry conditioning: adds learned CNN encoder to extract geometric features
# from context channels and combines with time embedding via AdaLN
use_geometry_conditioning: true

# Number of context channels (first N channels are context, rest are noisy target)
context_channels: 5
