# Training config for the 1-push SCORER (HACMan-critic / F-classifier, car d5, 60x5).
#
# Usage:
#   python src/train_classifier.py --config-name=train_scorer \
#       data_dir=/scratch/dm1487/h5/v3_scorer_1push
#
name: scorer_1push
output_dir: /scratch/dm1487/sage_outputs/scorer/${name}

# Data
data_dir: /scratch/dm1487/h5/v3_scorer_1push
batch_size: 128
num_workers: 8
image_size: 64
num_depths: 5         # car d5 (60 edges x 5 depths)

# Training
max_epochs: 200
check_val_every_n_epoch: 1
early_stopping_patience: 25
log_every_n_steps: 50
precision: 16-mixed

# Learning rate
base_lr: 0.0003
end_lr: 0.000001
warmup_steps: 500
decay_steps: 100000
weight_decay: 0.01

# Model / loss
use_local: true
use_coord_grid: false
context_channels: 5
pos_weight: 1.0       # bump if F too sparse (hard scenes ~3% positive among reachable)
use_focal_loss: false
focal_alpha: 0.25
focal_gamma: 2.0
dice_weight: 1.0      # BCE-on-all + Dice-on-reachable
soft_edge_sigma: 0.0
soft_depth_sigma: 0.0

defaults:
  - data: scorer_data
  - model: classifier
  - network: scorer_dit
