# V3: stratified-sampling variant on top of V1b's recipe.
# Same loss config as V1b (pos_weight=5, focal, dice=1.0) — only sampler differs.
# Tests: does forcing 50/50 hard/easy batches improve hard-bucket performance?

name: v3_stratified_hard50
output_dir: /common/users/dm1487/scratch_namo/classifier_experiments/${name}

data_dir: ???
batch_size: 64
num_workers: 4
image_size: 64

max_epochs: 60
check_val_every_n_epoch: 1
early_stopping_patience: 15
log_every_n_steps: 50
precision: 16-mixed

base_lr: 0.0003
end_lr: 0.000001
warmup_steps: 500
decay_steps: 60000
weight_decay: 0.01

use_local: true
use_coord_grid: false
context_channels: 5

# Same loss as V1b (within-instance imbalance + focal)
pos_weight: 5.0
use_focal_loss: true
focal_alpha: 0.25
focal_gamma: 2.0
dice_weight: 1.0
soft_edge_sigma: 0.0
soft_depth_sigma: 0.0

defaults:
  - data: classifier_data_stratified   # ← key change vs V1b
  - model: classifier
  - network: dit_classifier
