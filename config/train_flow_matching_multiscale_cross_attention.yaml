defaults:
  - _self_

wandb_name: "${now:%Y-%m-%d_%H-%M-%S}"

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 1000
  accelerator: gpu
  devices: auto
  strategy: ddp
  gradient_clip_val: 1.0
  logger:
    _target_: lightning.pytorch.loggers.WandbLogger
    project: "sage_learning"
    name: "${wandb_name}"
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: "${hydra:run.dir}/checkpoints"
      filename: "epoch={epoch:03d}-val_loss={val_loss:.4f}"
      monitor: "val_loss"
      mode: "min"
      save_top_k: 3
      save_last: true
      every_n_epochs: 1
      auto_insert_metric_name: false

model:
  _target_: src.model.generative_module.UnifiedGenerativeModule
  pose_stats_file: "${hydra:runtime.cwd}/config/stats_mean_std.json"
  crop_size_meters: 5.0
  overfit_mode: false
  norm_mode: mean_std

  network:
    _target_: src.model.networks.multiscale_cross_attention_vector_denoiser.MultiScaleCrossAttentionVectorDenoiserBackbone
    vector_dim: 3
    image_channels: 5
    hidden_dim: 256
    num_layers: 6
    num_heads: 8
    token_grids: [16, 8, 4]
    mlp_ratio: 4.0

  path:
    _target_: src.model.common.FlowMatchingPath
    sigma_min: 1e-5

  sampler:
    _target_: src.model.common.ODESampler
    method: 'euler'

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 3e-4
    weight_decay: 1e-4

  context_channels: 5
  use_local: true
  vector_dim: 3

data:
  _target_: src.data.mask_diffusion_data.MaskDiffusionDataModule
  h5_file: "/common/users/shared/robot_learning/dm1487/namo/datasets/h5_files/se2/dec30/aug9_envs/1_push_train/training_data.h5"
  data_dir: null
  batch_size: 32
  num_workers: 5
  use_local: true
  image_size: 224
  use_coord_grid: false
  train_split: 0.9
