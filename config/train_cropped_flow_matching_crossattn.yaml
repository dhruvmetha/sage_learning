# Training Configuration for Cropped Flow Matching with Cross-Attention
# Uses Facebook's flow_matching library + cross-attention for context
#
# Usage:
#   python src/train_generative.py --config-name=train_cropped_flow_matching_crossattn

# Experiment name (used in output path)
name: cropped_flow_matching_crossattn
output_dir: /common/users/dm1487/namo_data/outputs/${name}
data_dir: /common/users/dm1487/namo_data/h5_files/dec2/aug9_envs/1_push_train_corrected_overlaps

# Resume from checkpoint (set to path to resume training, null to start fresh)
ckpt_path: null

# Hydra output directory structure
hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

defaults:
  - _self_
  - data: mask_diffusion_data_cropped
  - model: generative_cropped_flow_matching_crossattn
  - trainer: multi_gpu
  - callbacks: default

# Random seed
seed: 42

# Data loading
num_workers: 0
batch_size: 64

# Training
max_epochs: 1000
check_val_every_n_epoch: 1

# Learning rate schedule
base_lr: 0.0001
end_lr: 0.000001
warmup_steps: 1000
decay_steps: 300000

# Size configuration
context_size: 64  # Full context for cross-attention encoder
crop_size: 24     # Center crop for target prediction

# GPU (for legacy compatibility)
gpu_id: 0

# Sampling steps for inference (ODE solver steps)
sampling_steps: 50

# Paths
paths:
  output_dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
