# HuggingFace Diffusion Model with Cross-Attention Conditioning
# Uses cross-attention instead of AdaLN for context conditioning
#
# Key differences from generative_hf_diffusion.yaml:
# - Context channels are extracted and encoded separately
# - Transformer uses cross-attention to attend to context features
# - Only coord_grid + noisy_target go through the main transformer

_target_: src.model.generative_module.GenerativeModule

# Neural network backbone (DiTCrossAttn)
network:
  _target_: src.model.dit.dit_crossattn.DiTCrossAttn
  img_size: ${image_size}
  patch: 4
  in_ch: 8      # 5 context + 2 coord_grid + 1 noisy_target
  context_channels: ${context_channels}
  out_ch: 1     # target_goal
  dim: 256
  depth: 8
  heads: 8

# HuggingFace diffusion path
path:
  _target_: src.model.paths.hf_diffusion_path.HFDiffusionPath
  num_train_timesteps: 1000
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon

# HuggingFace DDIM sampler (deterministic, faster)
sampler:
  _target_: src.model.samplers.hf_diffusion_sampler.HFDiffusionSampler
  sampler_type: ddim
  num_train_timesteps: 1000
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon
  eta: 0.0
  clip_sample: false

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: ${base_lr}
  weight_decay: 0.01

# Auxiliary loss weight
aux_loss_weight: 0.005

# Channel configuration
context_channels: ${context_channels}
target_channels: 1

# Use local (object-centered) masks instead of global
use_local: ${use_local}

# LR schedule
warmup_steps: ${warmup_steps}
decay_steps: ${decay_steps}
end_lr: ${end_lr}
