# Facebook Flow Matching Model with Cross-Attention Conditioning
# Uses Facebook's flow_matching library + cross-attention for context
# Install: pip install flow-matching torchdyn
#
# Key differences from generative_fb_flow_matching.yaml:
# - Context channels are extracted and encoded separately
# - Transformer uses cross-attention to attend to context features

_target_: src.model.generative_module.GenerativeModule

# Neural network backbone (DiTCrossAttn)
network:
  _target_: src.model.dit.dit_crossattn.DiTCrossAttn
  img_size: ${image_size}
  patch: 4
  in_ch: 8      # 5 context + 2 coord_grid + 1 noisy_target
  context_channels: ${context_channels}
  out_ch: 1     # target_goal
  dim: 256
  depth: 8
  heads: 8

# Facebook's flow matching path (Conditional OT)
path:
  _target_: src.model.paths.fb_flow_matching_path.FBFlowMatchingPath
  scheduler: condot
  sigma_min: 0.0

# Facebook's ODE sampler for inference
sampler:
  _target_: src.model.samplers.fb_ode_sampler.FBODESampler
  method: midpoint  # or 'dopri5' for adaptive
  atol: 1e-5
  rtol: 1e-5

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: ${base_lr}
  weight_decay: 0.01

# Auxiliary loss weight (dice loss on reconstructed output)
aux_loss_weight: 0.005

# Channel configuration
context_channels: ${context_channels}
target_channels: 1

# Use local (object-centered) masks instead of global
use_local: ${use_local}

# LR schedule
warmup_steps: ${warmup_steps}
decay_steps: ${decay_steps}
end_lr: ${end_lr}
