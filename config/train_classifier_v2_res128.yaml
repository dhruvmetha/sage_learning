# Variant V2: higher input resolution
# Tests hypothesis: 64x64 / 5m crop = 0.078m/pixel is too coarse for fine-grained
# F structure on hard problems. Object size ~30cm = 4 pixels at 64. At 128: 8 pixels.

name: v2_res128
output_dir: /common/users/dm1487/scratch_namo/classifier_experiments/${name}

data_dir: ???
batch_size: 32                # half because 128x128 inputs use ~4x memory/compute
num_workers: 4
image_size: 128               # CHANGE: was 64

max_epochs: 40                # fewer because ~4x slower per epoch
check_val_every_n_epoch: 1
early_stopping_patience: 10
log_every_n_steps: 50
precision: 16-mixed

base_lr: 0.0003
end_lr: 0.000001
warmup_steps: 500
decay_steps: 40000
weight_decay: 0.01

use_local: true
use_coord_grid: false
context_channels: 5

# Default imbalance settings (isolate the resolution variable)
pos_weight: 1.0
use_focal_loss: false
focal_alpha: 0.25
focal_gamma: 2.0
dice_weight: 1.0
soft_edge_sigma: 0.0
soft_depth_sigma: 0.0

defaults:
  - data: classifier_data
  - model: classifier
  - network: dit_classifier
