# Training Configuration for Cropped HuggingFace Diffusion with Cross-Attention - Multi-Horizon
# Predicts both goal_mask_a1 and goal_mask_a2 simultaneously with center cropping
#
# Key features:
# - Context at full resolution (64x64) for cross-attention encoder
# - Targets center-cropped (24x24) for focused prediction
# - Masked loss: channel 2 only supervised when solution_depth >= 2
#
# Usage:
#   python src/train_generative.py --config-name=train_cropped_diffusion_crossattn_multihorizon
#
# With custom data directory:
#   python src/train_generative.py --config-name=train_cropped_diffusion_crossattn_multihorizon \
#       data_dir=/path/to/2_push_data.h5

# Experiment name (used in output path)
name: cropped_diffusion_crossattn_multihorizon
output_dir: /common/users/dm1487/namo_data/outputs/${name}
data_dir: /common/users/dm1487/namo_data/h5_files/dec2/aug9_envs/2_push_train_corrected_overlaps_2.h5

# Resume from checkpoint (set to path to resume training, null to start fresh)
ckpt_path: null

# Hydra output directory structure
hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

defaults:
  - _self_
  - data: mask_diffusion_data_cropped_multihorizon
  - model: generative_cropped_diffusion_crossattn_multihorizon
  - trainer: multi_gpu
  - callbacks: default

# Random seed
seed: 42

# Data loading
num_workers: 0
batch_size: 256

# Training
max_epochs: 1000
check_val_every_n_epoch: 1

# Learning rate schedule
base_lr: 0.0004
end_lr: 0.000001
warmup_steps: 1000
decay_steps: 300000

# Size configuration
context_size: 64  # Full context for cross-attention encoder
crop_size: 24     # Center crop for target prediction

# GPU (for legacy compatibility)
gpu_id: 0

# Sampling steps for inference
sampling_steps: 50

# Paths
paths:
  output_dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
