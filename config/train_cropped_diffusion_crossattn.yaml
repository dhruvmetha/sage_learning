# Training Configuration for Cropped HuggingFace Diffusion with Cross-Attention
# Uses cross-attention instead of AdaLN for context conditioning
#
# Usage:
#   python src/train_generative.py --config-name=train_cropped_diffusion_crossattn

# Experiment name (used in output path)
name: cropped_diffusion_crossattn_balanced_solutions
output_dir: /common/users/dm1487/namo_data/outputs/${name}
# data_dir: /common/users/dm1487/namo_data/h5_files/dec2/aug9_envs/2_push_train_corrected_overlaps_2
data_dir: /common/users/dm1487/namo_data/h5_files/dec25/aug9_envs/1_push_train
# Resume from checkpoint (set to path to resume training, null to start fresh)
ckpt_path: null

# Hydra output directory structure
hydra:
  run:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

defaults:
  - _self_
  - data: mask_diffusion_data_cropped
  - model: generative_cropped_diffusion_crossattn
  - trainer: single_gpu
  - callbacks: default

# Random seed
seed: 42

# Data loading
num_workers: 0
batch_size: 64
use_h5: true

# Weighted sampling strategy: "none", "inverse_solutions", or "solution_depth"
weighted_sampling: inverse_solutions

# Training
max_epochs: 1000
check_val_every_n_epoch: 1

# Learning rate schedule
base_lr: 0.0004
end_lr: 0.000001
warmup_steps: 1000
decay_steps: 300000

# Size configuration
context_size: 64  # Full context for cross-attention encoder
crop_size: 24     # Center crop for target prediction

# GPU (for legacy compatibility)
gpu_id: 0

# Sampling steps for inference
sampling_steps: 50

# Paths
paths:
  output_dir: ${output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
